<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEYRA EMPIRE</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://veyra-empire.github.io/scripts/">

  <!-- Fallback for anything that blocks the script below. A meta refresh
       cannot carry a query string or hash, which is why the script goes
       first and this only catches what it misses. -->
  <meta http-equiv="refresh" content="0; url=/scripts/">

  <style>
    /* The archive's own background, so passing through here does not flash
       white on the way to /scripts/. */
    html { background: #0a0612; color: #f5e9d0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 0 16px; text-align: center;
    }
    a { color: #f2c072; }
  </style>
</head>
<body>
  <p>Taking you to the <a href="/scripts/">VEYRA EMPIRE archive</a>&hellip;</p>

  <script>
    // Carries ?query and #hash across, which the meta refresh above cannot.
    // replace() rather than href: the hop stays out of history, so Back from
    // the archive returns where the member came from instead of bouncing
    // them through here again.
    location.replace('/scripts/' + location.search + location.hash);
  </script>
</body>
</html>
